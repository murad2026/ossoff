name: Deploy API (Cloudflare Worker)

# Runs when worker code changes, or by hand from the Actions tab.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY, HASH_SALT, ADMIN_TOKEN
# Optional: TURNSTILE_SECRET
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set yet — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Run tests
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: node --test test/*.test.js

      - name: Deploy worker and set secrets
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            HASH_SALT
            ADMIN_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
