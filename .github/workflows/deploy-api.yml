name: Deploy API (Cloudflare Worker + D1)

# Runs when worker code changes, or by hand from the Actions tab.
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, HASH_SALT, ADMIN_TOKEN
# The Cloudflare token needs: Account · Workers Scripts · Edit  and  Account · D1 · Edit.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set yet — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Run tests
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: node --test --no-warnings test/*.test.js

      - name: Create the D1 database if needed and apply the schema
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          find_id() {
            npx -y wrangler@4 d1 list --json | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s.slice(s.indexOf("[")));
                const db=j.find(x=>x.name==="draft-ossoff-db");
                process.stdout.write(db ? (db.uuid||db.id||"") : "");
              });'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Creating D1 database draft-ossoff-db…"
            npx -y wrangler@4 d1 create draft-ossoff-db
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "Could not find or create the D1 database"; exit 1; fi
          echo "D1 database id: $ID"
          sed -i "s/REPLACED_BY_WORKFLOW/$ID/" wrangler.toml
          npx -y wrangler@4 d1 execute draft-ossoff-db --remote --file=schema.sql

      - name: Deploy worker and set secrets
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
            HASH_SALT
            ADMIN_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Show the API address
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "API deployed: ${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"
