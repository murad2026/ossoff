name = "draft-ossoff-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated list of sites allowed to call the API (your GitHub Pages URL and custom domain).
ALLOWED_ORIGINS = "https://murad2026.github.io"
# Fast, low-cost model for moderation. Change if you want a stronger one.
CLAUDE_MODEL = "claude-haiku-5-5"

# Database: Cloudflare D1 (free tier). The "Deploy API" workflow creates it on first run
# and writes the real id below; you don't need to touch this by hand.
[[d1_databases]]
binding = "DB"
database_name = "draft-ossoff-db"
database_id = "REPLACED_BY_WORKFLOW"

# Secrets (set by the GitHub workflow from repository secrets — never commit them):
#   ANTHROPIC_API_KEY  — from platform.claude.com
#   HASH_SALT          — any long random string
#   ADMIN_TOKEN        — owner password for the moderator page
#   TURNSTILE_SECRET   — optional, Cloudflare Turnstile captcha secret
