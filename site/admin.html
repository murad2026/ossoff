<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moderation — Draft Ossoff 2028</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Source+Serif+4:ital,wght@1,500&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=4">
<style>
.adm{max-width:1100px;margin:0 auto;padding:28px max(4vw,16px) 64px}
.adm h1{font-family:var(--display);text-transform:uppercase;margin:0 0 6px;font-size:38px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{border:1.5px solid var(--line);border-left:6px solid #F2C14E;border-radius:10px;padding:16px;margin:0 0 14px;background:var(--bg)}
.item.appeal{border-left-color:var(--red)}
.item blockquote{margin:6px 0 10px;font-family:var(--serif);font-style:italic;font-size:18px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.flag{background:light-dark(#FFF4D6,#3A2E08);color:light-dark(#6B4B00,#F2D58A);padding:2px 8px;border-radius:999px;font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.act input{max-width:340px}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.token{font-family:ui-monospace,monospace;background:var(--paper);padding:12px;border-radius:8px;word-break:break-all}
</style>
<script src="config.js?v=4"></script>
</head>
<body>
<div class="disclaimer"><strong>Moderator area.</strong> Rule #1: moderate tone, not viewpoint. Every action is logged with your name.</div>
<main class="adm">
  <h1>Moderation</h1>
  <p id="who" class="lead"></p>

  <form id="login" class="item" style="border-left-color:var(--navy)">
    <label for="tok">Your personal moderator token</label>
    <div class="row"><input id="tok" type="password" autocomplete="current-password" required><button class="btn btn-navy" type="submit">Sign in</button></div>
    <p class="form-msg" id="loginMsg" role="status"></p>
  </form>

  <div id="panel" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="pending" aria-selected="true">Queue</button>
      <button role="tab" data-tab="approved" aria-selected="false">Published</button>
      <button role="tab" data-tab="rejected" aria-selected="false">Rejected</button>
      <button role="tab" data-tab="hidden" aria-selected="false">Hidden</button>
      <button role="tab" data-tab="team" aria-selected="false" id="teamTab">Team</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
      <button type="button" id="logout" style="margin-left:auto">Sign out</button>
    </div>
    <div id="view"></div>
  </div>
</main>
<script src="admin.js?v=4"></script>
</body>
</html>
